[project]
name = "emby-mcp"
version = "0.3.1"
description = "Model Context Protocol (MCP) server that connects an Emby media server to an AI client such as Claude Desktop."
readme = "README.md"
requires-python = ">=3.13"
license = {text = "GPL-3.0-or-later"}
authors = [
    {name = "Dominic Search", email = "code@angeltek.co.uk"},
]
keywords = ["emby", "mcp", "ai", "media", "claude", "emby-mcp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Video",
]
dependencies = [
    "dotenv>=0.9.9",
    "embyclient>=4.9.0.33",
    # mcp 2.x removed mcp.server.fastmcp, which this server is built on
    "mcp[cli]>=1.9.4,<2",
    "unidecode>=1.4.0",
    "typer>=0.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
]

[project.scripts]
emby-mcp = "emby_mcp.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["emby_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["emby_mcp"]
omit = [
    # An interactive developer harness, not shipped behaviour. It is imported only when
    # MY_DEBUG is set by hand in emby_mcp/server.py, drives a live Emby server, and selects
    # what to exercise via "if True:" edits, so there is nothing here to assert against.
    "emby_mcp/debug.py",
]

[tool.coverage.report]
exclude_also = [
    "if __name__ == .__main__.:",
    # Guards the debug harness omitted above; dead code unless MY_DEBUG is edited to True.
    "if MY_DEBUG",
]